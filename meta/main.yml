---

galaxy_info:
  role_name: ansible_role_swap
  author: "iamenr0s"
  description: "Manage Linux swap runtime state: enable (swapon -a) or disable (swapoff -a); optionally tune vm.swappiness."
  license: MIT
  min_ansible_version: "2.9"
  platforms:
    - name: "Debian"
      versions:
        - "bookworm"
        - "trixie"
    - name: "EL"
      versions:
        - "8"
        - "9"
        - "10"
    - name: "Fedora"
      versions:
        - "42"
        - "43"
        - "44"
    - name: "Rocky"
      versions:
        - "all"
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"
  galaxy_tags:
    - swap
    - memory
    - performance
    - sysctl
    - linux

dependencies: []
collections:
  - ansible.posix
